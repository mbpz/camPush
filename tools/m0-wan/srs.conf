# CamPush M0-WAN 本地验证：RTMP 接入 -> HTTP-FLV / HLS
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
pid                 ./objs/srs.pid;

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled     on;
        hls_path    ./objs/nginx/html;
        hls_fragment 2;
        hls_window  10;
    }
    http_hooks {
        enabled     off;
    }
}
