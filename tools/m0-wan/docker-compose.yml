# CamPush P2 M0-WAN 本地栈（仅开发验证，不是生产部署）
# 固定使用 localhost/端口访问，不修改宿主机或 OrbStack 网络配置。
# 用法：cd tools/m0-wan && docker compose up -d
# 停止：docker compose down
services:
  srs:
    image: ossrs/srs:6
    container_name: campush-srs
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    environment:
      # 本机/局域网 IP（WebRTC ICE candidate；仅 SRS 内部使用）
      CANDIDATE: ${CANDIDATE:-127.0.0.1}
    ports:
      - "1935:1935"     # RTMP ingest
      - "18080:8080"    # HTTP-FLV / HLS / WHIP/WHEP 页面
      - "1985:1985"     # SRS HTTP API
      - "8000:8000/udp" # WebRTC RTC port
      - "8000:8000/tcp" # WebRTC over TCP
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
    restart: unless-stopped

  # TURN（NAT 穿透）。本机 macOS 验证时可先不启，公网/E2 时必需。
  coturn:
    image: docker.1ms.run/coturn/coturn:latest
    container_name: campush-turn
    environment:
      CANDIDATE: ${CANDIDATE:-127.0.0.1}
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-${CANDIDATE:-127.0.0.1}}
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-dev-turn-secret}"
      - "--realm=campush.local"
      - "--fingerprint"
      - "--no-cli"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--external-ip=${TURN_EXTERNAL_IP:-${CANDIDATE:-127.0.0.1}}"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
