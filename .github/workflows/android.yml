name: Android CI (APK)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "覆盖 versionName（默认取 git tag/短 SHA）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found; installing minimal packages"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK"

      - name: Compute version
        id: version
        shell: bash
        run: |
          CODE="$(git rev-list --count HEAD)"
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then
            NAME="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          fi
          NAME="${NAME#v}"
          SAFE="$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '-')"
          SAFE="${SAFE%-}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "file=campush-${SAFE}-${CODE}.apk" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME ($CODE)"

      - name: Build (tests + debug APK)
        run: |
          gradle --no-daemon --console=plain \
            :lan-core:test :app:assembleDebug \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PgitSha=${GITHUB_SHA::8}

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${{ steps.version.outputs.file }}"
          sha256sum "artifacts/${{ steps.version.outputs.file }}" | tee artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campush-apk-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: artifacts/
          retention-days: 30

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CamPush ${{ steps.version.outputs.name }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
