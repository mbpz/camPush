<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CamPush 云端观看</title>
<style>
  :root{color-scheme:dark}html,body{margin:0;height:100%;background:#0b0f14;color:#e8eef6;font:14px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif}
  #wrap{display:flex;flex-direction:column;height:100%}
  video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b0f14;border-top:1px solid #1e2a38;font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.dot.ok{background:#34d399}.dot.bad{background:#ef4444}
  #status{flex:1;color:#93a4b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{background:#182331;color:#e8eef6;border:1px solid #26364a;border-radius:6px;padding:6px 10px}
  #err{display:none;padding:18px;color:#fca5a5;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" autoplay playsinline muted></video>
  <div id="wm">CamPush</div>
<div id="bar">
    <span id="dot" class="dot"></span>
    <span id="status">准备中…</span>
    <span id="stats"></span>
    <span id="proto">—</span>
    <button id="switch" type="button">切换协议</button>
    <button id="report" type="button">举报</button>
    <button id="retry" type="button">重试</button>
  </div>
  <div id="err"></div>
</div>
<script src="/assets/hls.min.js"></script>
<script src="/assets/mpegts.min.js"></script>
<script>
(() => {
  const roomId = location.pathname.split('/').filter(Boolean).pop();
  const params = new URLSearchParams(location.search);
  const wm = (params.get('wm') || 'CamPush').slice(0, 32);
  document.getElementById('wm').textContent = wm;
  let forced = params.get('force') || '';
  let currentProtocol = '';

  const pageToken = params.get('token') || '';
  const v = document.getElementById('v');
  const statusEl = document.getElementById('status');
  const dot = document.getElementById('dot');
  const protoEl = document.getElementById('proto');
  const statsEl = document.getElementById('stats');
  const errEl = document.getElementById('err');
  let pc = null, hls = null, flv = null, current = null, statsTimer = null, lastBytes = 0, lastTs = 0;

  const setStatus = (t, kind = '') => {
    statusEl.textContent = t;
    dot.className = 'dot ' + kind;
  };
  const fail = (e) => {
    errEl.style.display = 'block';
    errEl.textContent = '播放失败：' + (e && e.message ? e.message : e) + '\n可点击重试。';
    setStatus('失败', 'bad');
  };
  const stop = () => {
    if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
    if (flv) { try { flv.destroy(); } catch (_) {} flv = null; }
    if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    statsEl.textContent = '';
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    v.srcObject = null; v.removeAttribute('src'); v.load();
  };

  async function playSession(pin) {
    const r = await fetch(`/api/v1/rooms/${roomId}/play-session`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Page-Token': pageToken },
      body: JSON.stringify(pin ? { pin } : {}),
    });
    if (r.status === 401) {
      const data = await r.json().catch(() => ({}));
      if (data.code === 3005) {
        const entered = prompt('请输入 4-6 位观看 PIN');
        if (entered) return playSession(entered);
      }
    }
    if (!r.ok) throw new Error('play-session HTTP ' + r.status);
    return await r.json();
  }

  function startStats() {
    if (statsTimer) clearInterval(statsTimer);
    lastBytes = 0; lastTs = performance.now();
    statsTimer = setInterval(async () => {
      try {
        if (pc) {
          const stats = await pc.getStats();
          stats.forEach((r) => {
            if (r.type === 'inbound-rtp' && r.kind === 'video') {
              const now = performance.now();
              const bytes = r.bytesReceived || 0;
              const kbps = lastBytes && now > lastTs ? Math.round((bytes - lastBytes) * 8 / (now - lastTs)) : 0;
              lastBytes = bytes; lastTs = now;
              statsEl.textContent = `${r.frameWidth || '?'}x${r.frameHeight || '?'} · ${Math.round(r.framesPerSecond || 0)}fps · ${kbps}kbps`;
            }
          });
        } else if (v.videoWidth) {
          const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {};
          statsEl.textContent = `${v.videoWidth}x${v.videoHeight} · drop ${q.droppedVideoFrames ?? 0}`;
        }
      } catch (_) {}
    }, 1000);
  }

  let sessionTurn = null;

  async function tryWhep(url, mediaToken) {
    const iceServers = sessionTurn ? [{ urls: sessionTurn.urls, username: sessionTurn.username, credential: sessionTurn.credential }] : [];
    const relayOnly = params.get('relay') === '1';

    pc = new RTCPeerConnection({ iceServers, iceTransportPolicy: relayOnly ? 'relay' : 'all' });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    pc.ontrack = (ev) => {
      const stream = ev.streams[0] || new MediaStream([ev.track]);
      v.srcObject = stream;
      v.play().catch(() => {});
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp', 'Authorization': 'Bearer ' + mediaToken },
      body: offer.sdp,
    });
    if (!res.ok) throw new Error('WHEP HTTP ' + res.status);
    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    await waitPlaying(5000);
    startStats();
  }

  function waitPlaying(ms) {
    return new Promise((resolve, reject) => {
      const t0 = Date.now();
      const timer = setInterval(() => {
        if (v.readyState >= 3 || v.currentTime > 0) { clearInterval(timer); resolve(); }
        else if (Date.now() - t0 > ms) { clearInterval(timer); reject(new Error('WHEP 首帧超时')); }
      }, 150);
    });
  }

  async function tryFlv(url) {
    if (!(window.mpegts && window.mpegts.isSupported())) throw new Error('FLV 不支持');
    flv = window.mpegts.createPlayer({ type: 'flv', isLive: true, url });
    flv.attachMediaElement(v);
    flv.load();
    v.play().catch(() => {});
    await waitPlaying(6000);
  }

  async function startHls(url) {
    if (window.Hls && window.Hls.isSupported()) {
      await new Promise((resolve, reject) => {
        hls = new window.Hls({ liveSyncDurationCount: 2, lowLatencyMode: false });
        hls.loadSource(url);
        hls.attachMedia(v);
        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          v.play().catch(() => {});
          startStats();
          waitPlaying(8000).then(resolve).catch(reject);
        });
        hls.on(window.Hls.Events.ERROR, (_, data) => { if (data.fatal) reject(new Error('HLS ' + data.details)); });
      });
    } else {
      v.src = url;
      v.play().catch(() => {});
      await waitPlaying(8000);
    }
  }

  function report(event, extra) {
    try {
      fetch('/api/v1/telemetry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ roomId, event, ts: Date.now() }, extra || {})),
        keepalive: true,
      }).catch(() => {});
    } catch (_) {}
  }

  function reportFirstFrame(protocol) {
    if (reported) return;
    reported = true;
    report('play_first_frame', { protocol, timeToFirstFrameMs: Math.max(0, Date.now() - startedAt) });
  }

  async function start() {
    stop();
    errEl.style.display = 'none';
    reported = false;
    startedAt = Date.now();
    setStatus('连接中…');
    try {
      const session = await playSession();
      sessionTurn = session.turn || null;
      const protocols = session.protocols || {};
      current = session;
      if (forced !== 'flv' && forced !== 'hls' && protocols.webrtc && protocols.webrtc.url) {
        protoEl.textContent = 'WHEP';
        try {
          await tryWhep(protocols.webrtc.url, session.mediaToken);
          setStatus('WHEP 已连接', 'ok');
          currentProtocol = 'whep';
          reportFirstFrame('whep');
          return;
        } catch (e) {
          console.warn('WHEP failed, fallback', e);
        }
      }
      if (forced !== 'hls' && protocols.flv && protocols.flv.url) {
        protoEl.textContent = 'FLV';
        try {
          await tryFlv(protocols.flv.url);
          setStatus('FLV 播放中', 'ok');
          currentProtocol = 'flv';
          reportFirstFrame('flv');
          return;
        } catch (e) {
          console.warn('FLV failed, fallback', e);
        }
      }
      if (forced !== 'flv' && protocols.hls && protocols.hls.url) {
        protoEl.textContent = 'HLS';
        await startHls(protocols.hls.url);
        setStatus('HLS 播放中', 'ok');
        currentProtocol = 'hls';
        reportFirstFrame('hls');
        return;
      }
      throw new Error('无可用协议');
    } catch (e) {
      fail(e);
    }
  }

  document.getElementById('retry').onclick = start;
  document.getElementById('report').onclick = async () => {
    const roomId = location.pathname.split('/').filter(Boolean).pop() || '';
    const reason = prompt('举报原因：abuse / illegal / privacy / other', 'abuse');
    if (!reason || !roomId) return;
    try {
      const r = await fetch('/api/v1/rooms/' + encodeURIComponent(roomId) + '/report', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      });
      const data = await r.json().catch(() => ({}));
      setStatus(r.ok ? '已提交举报' : '举报失败：' + (data.message || r.status), r.ok ? 'ok' : 'error');
    } catch (e) { setStatus('举报失败：' + e.message, 'error'); }
  };
  document.getElementById('switch').onclick = () => {
    const order = ['whep', 'flv', 'hls'];
    const now = order.indexOf(currentProtocol || forced || 'whep');
    const next = order[(now + 1) % order.length];
    report('protocol_switch', { from: currentProtocol || 'none', to: next });
    forced = next;
    start();
  };
  start();
})();
</script>
</body>
</html>
