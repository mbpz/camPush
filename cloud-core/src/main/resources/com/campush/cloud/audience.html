<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamPush 观众端</title>
<style>
  :root{color-scheme:dark}body{margin:0;background:#0b0f14;color:#e8eef6;font:14px/1.5 system-ui,"PingFang SC",sans-serif}
  header{padding:20px 18px 10px;display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0;flex:1}.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
  #list{padding:8px 18px 28px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  a.card{display:block;padding:14px;border:1px solid #1e2a38;border-radius:10px;background:#121a24;color:inherit;text-decoration:none}
  .row{display:flex;align-items:center;gap:8px}.state{padding:2px 8px;border-radius:999px;background:#182331;color:#93a4b8;font-size:12px}
  .state.live{background:rgba(52,211,153,.15);color:#34d399}.sub{color:#93a4b8;font-size:12px;margin-top:6px}
  #empty{color:#93a4b8;padding:20px 18px;display:none}#err{color:#fca5a5;padding:0 18px}
</style>
</head>
<body>
<header><span class="dot"></span><h1>CamPush 观众端</h1><span id="count" style="color:#93a4b8;font-size:12px"></span></header>
<div id="err"></div>
<div id="list"></div>
<div id="empty">暂无公开房间；主播创建 WAN 房间后会出现在这里。</div>
<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const err = document.getElementById('err');
async function refresh() {
  try {
    const r = await fetch('/api/v1/rooms', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const rooms = data.rooms || [];
    count.textContent = rooms.length ? rooms.length + ' 个房间' : '';
    empty.style.display = rooms.length ? 'none' : 'block';
    err.textContent = '';
    list.innerHTML = rooms.map(room => {
      const live = room.state === 'live' || room.state === 'switching';
      return `<a class="card" href="${room.playUrl}">
        <div class="row"><strong>${room.roomId}</strong><span class="state ${live ? 'live' : ''}">${live ? '直播中' : room.state}</span></div>
        <div class="sub">观看 ${room.viewers ?? 0}${room.pinRequired ? ' · 需要 PIN' : ''}</div>
      </a>`;
    }).join('');
  } catch (e) {
    err.textContent = '加载失败：' + (e && e.message ? e.message : e);
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
