<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CamPush 可观测性</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#0b0f14;color:#e8eef6;font:14px/1.6 system-ui,"PingFang SC",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 18px}h1{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{border:1px solid #1e2a38;background:#121a24;border-radius:10px;padding:12px}
.k{color:#93a4b8;font-size:12px}.v{font-size:22px;font-weight:700;margin-top:4px;color:#34d399}
pre{background:#121a24;border:1px solid #1e2a38;border-radius:10px;padding:12px;overflow:auto;font-size:12px}
</style></head><body><main>
<h1>CamPush 可观测性</h1>
<div class="grid">
  <div class="card"><div class="k">房间数</div><div class="v" id="rooms">-</div></div>
  <div class="card"><div class="k">首帧样本</div><div class="v" id="frames">-</div></div>
  <div class="card"><div class="k">协议切换</div><div class="v" id="switches">-</div></div>
</div>
<h3>首帧分位（ms）</h3><pre id="first">-</pre>
<h3>原始指标</h3><pre id="raw">-</pre>
<script>
async function load(){
  try {
    const [m, r] = await Promise.all([
      fetch('/api/v1/metrics',{cache:'no-store'}).then(x=>x.json()),
      fetch('/api/v1/rooms',{cache:'no-store'}).then(x=>x.json()),
    ]);
    document.getElementById('rooms').textContent = (r.rooms||[]).length;
    document.getElementById('frames').textContent = (m.counts&&m.counts.play_first_frame)||0;
    document.getElementById('switches').textContent = (m.counts&&m.counts.protocol_switch)||0;
    document.getElementById('first').textContent = JSON.stringify(m.firstFrame||{}, null, 2);
    document.getElementById('raw').textContent = JSON.stringify(m, null, 2);
  } catch(e) { document.getElementById('raw').textContent = '加载失败：' + e; }
}
load(); setInterval(load, 5000);
</script></main></body></html>
