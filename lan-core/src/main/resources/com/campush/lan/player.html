<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>CamPush 实时画面</title>
<style>
:root{--bg:#0b0f14;--fg:#e8eef6;--muted:#8fa0b3;--line:#1e2a38;--accent:#34d399;--danger:#f87171;--card:#121a24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px;gap:10px;padding:10px 14px;min-height:52px;border-bottom:1px solid var(--line)}
#hud .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none}
#hud .dot.off{background:var(--muted);box-shadow:none}
#hud .sp{flex:1}
#hud .meta{display:flex;gap:10px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;min-width:0}
#hud button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:0 12px;font:inherit;font-size:13px}
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#v,#mj{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#mj[hidden],#v[hidden]{display:none}
#sound{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:999px;background:rgba(18,26,36,.92);color:var(--fg);padding:10px 18px;font:inherit;font-size:13px;border:1px solid var(--line)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(11,15,20,.86)}
.layer[hidden]{display:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadText{color:var(--muted);margin:0;font-size:14px}
#err .badge{width:52px;height:52px;border-radius:50%;border:2px solid var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
#err h1{font-size:19px;margin:0}
#errMsg{margin:0;max-width:30em;color:var(--fg)}
#errCode{color:var(--muted);font-size:12px;margin:0;min-height:1em}
#retry{border:0;border-radius:12px;background:var(--accent);color:#04120c;font:inherit;font-weight:600;padding:12px 28px;min-height:46px;margin-top:6px}
#err .list{color:var(--muted);font-size:12px;margin:0;text-align:left;max-width:32em}
#pinLayer .card{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left}
#pinLayer h2{margin:0;font-size:17px}
#pinLayer p{margin:0}
#pin{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#0a1219;color:var(--fg);font:inherit;font-size:22px;letter-spacing:.35em;text-align:center;padding:8px}
#pin:focus{outline:2px solid var(--accent);outline-offset:1px}
.errtext{color:var(--danger);font-size:13px;min-height:1.2em}
#pinOk{border:0;border-radius:10px;background:var(--accent);color:#04120c;font:inherit;font-weight:600;min-height:46px}
#pinOk[disabled]{opacity:.55}
#foot{padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;word-break:break-word}
@media (max-width:560px){#hud .meta{order:5;flex-basis:100%;justify-content:flex-end;font-size:12px}}
#foot b{color:#c9d6e5;font-weight:500}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-height:420px){#hud{min-height:44px;padding:6px 10px}#foot{display:none}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <span class="dot off" id="liveDot"></span>
    <span id="liveText" style="font-size:13px;color:var(--muted)">连接中</span>
    <span class="sp"></span>
    <div class="meta"><span id="mViewers"></span><span id="mRate"></span></div>
    <button id="btnSound" type="button" aria-label="开启声音">声音</button>
    <button id="btnFull" type="button" aria-label="全屏">全屏</button>
  </header>
  <main id="stage">
    <video id="v" playsinline autoplay muted></video>
    <img id="mj" alt="直播画面（兼容模式）">
    <div class="layer" id="load" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadText">正在加载…</p>
    </div>
    <div class="layer" id="err" hidden role="alert">
      <div class="badge" aria-hidden="true">!</div>
      <h1 id="errTitle">播放失败</h1>
      <p id="errMsg"></p>
      <p id="errCode"></p>
      <ul class="list" id="errTips" hidden>
        <li>确认观看设备与分享者在同一 Wi-Fi / 热点</li>
        <li>若路由器开启 AP 隔离/访客网络隔离，请关闭后重试</li>
        <li>确认分享者仍在推流，且浏览器为最新版本</li>
      </ul>
      <button id="retry" type="button">重试</button>
    </div>
    <div class="layer" id="pinLayer" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
        <h2 id="pinTitle">请输入观看口令</h2>
        <p class="visually-hidden" id="pinDesc">4 到 6 位数字，由分享者提供</p>
        <p style="color:var(--muted);font-size:13px">口令由分享者提供</p>
        <input id="pin" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{4,6}" aria-label="观看口令" aria-describedby="pinDesc">
        <p class="errtext" id="pinErr" role="alert"></p>
        <button id="pinOk" type="button">确定</button>
      </div>
    </div>
    <button id="sound" type="button" hidden>点击开启声音</button>
  </main>
  <footer id="foot"><b>仅同一局域网可观看</b> · 明文 HTTP，请勿在不可信网络使用</footer>
</div>
<script>
(function(){
'use strict';
/*TESTABLE-START*/
function concatAll(list){
  var n=0,i;
  for(i=0;i<list.length;i++){ n+=list[i].length; }

  for(i=0;i<list.length;i++){ out.set(list[i],p); p+=list[i].length; }

function asciiBytes(s){
  var a=new Uint8Array(s.length),i;
  for(i=0;i<s.length;i++){ a[i]=s.charCodeAt(i)&0xff; }

function u16be(v){ return new Uint8Array([(v>>>8)&0xff,v&0xff]); }
function u32be(v){ return new Uint8Array([(v>>>24)&0xff,(v>>>16)&0xff,(v>>>8)&0xff,v&0xff]); }

function mp4box(type,parts){ var body=concatAll(parts); return concatAll([u32be(8+body.length),asciiBytes(type),body]); }

function parsePathToken(path){

function parseFlvHeader(b){

function parseVideoTag(b,start,end){

function parseAudioTag(b,start,end){
  if(!b||end-start<2){ return null; }

}
var AAC_RATES=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
function parseAacAsc(b){
  if(!b||b.length<2){ return null; }

  var idx=((b[0]&7)<<1)|(b[1]>>7);
  var channels=(b[1]>>3)&15;
  if(objectType!==2||idx>=AAC_RATES.length){ return null; }
  return {objectType:objectType,sampleRate:AAC_RATES[idx],channels:channels||2,asc:new Uint8Array([b[0],b[1]])};

function parseAvcConfigRecord(b){
  if(!b||b.length<7||b[0]!==1){ return null; }

  var pos=5,n=b[pos++]&31;
  if(n===0){ return null; }

  for(i=0;i<n;i++){
    if(pos+2>b.length){ return null; }
    len=(b[pos]<<8)|b[pos+1]; pos+=2;
    if(len<1||pos+len>b.length){ return null; }
    sps.push(b.subarray(pos,pos+len)); pos+=len;
  }
  if(pos>=b.length){ return null; }
  var np=b[pos++]&255;
  if(np===0){ return null; }
  var pps=[];
  for(i=0;i<np;i++){
    if(pos+2>b.length){ return null; }
    len=(b[pos]<<8)|b[pos+1]; pos+=2;
    if(len<1||pos+len>b.length){ return null; }
    pps.push(b.subarray(pos,pos+len)); pos+=len;

function buildAvcC(cfg){
  if(!cfg||!cfg.sps||!cfg.sps.length||!cfg.pps||!cfg.pps.length){ return null; }
  var sps=cfg.sps[0],pps=cfg.pps[0];
  if(sps.length>65535||pps.length>65535){ return null; }
  var ls=cfg.lengthSize||4;
  return concatAll([
    new Uint8Array([1,cfg.profile&0xff,cfg.compat&0xff,cfg.level&0xff,0xfc|(ls-1),0xe0|1]),
    u16be(sps.length),sps,
    new Uint8Array([1]),u16be(pps.length),pps

function hex2(v){ var s=(v&0xff).toString(16).toUpperCase(); return s.length<2?'0'+s:s; }
function codecStringFromAvcC(cfg){
  if(!cfg){ return null; }
  return 'avc1.'+hex2(cfg.profile)+hex2(cfg.compat)+hex2(cfg.level);
}
function parseAvcNalus(payload,lengthSize){
  if(!payload){ return []; }
  if(lengthSize!==1&&lengthSize!==2&&lengthSize!==4){ return []; }
  var out=[],p=0,n=payload.length;
  while(p+lengthSize<=n){
    var len=0,i;
    for(i=0;i<lengthSize;i++){ len=(len<<8)|payload[p+i]; }
    p+=lengthSize;
    if(len<=0||p+len>n){ break; }
    out.push(payload.subarray(p,p+len));
    p+=len;
  }
  return out;
}
function spsToRbsp(sps){
  var out=[],i,zeros=0;
  for(i=0;i<sps.length;i++){
    var b=sps[i];
    if(zeros>=2&&b===3){ zeros=0; continue; }
    if(b===0){ zeros++; } else { zeros=0; }
    out.push(b);
  }
  return new Uint8Array(out);
}
function parseSpsSize(sps){
  if(!sps||sps.length<4){ return null; }
  var r=spsToRbsp(sps);
  var pos=(sps[0]&0x1f)===7?8:0; // 跳过 NAL header（SPS type 7）

    var byte=r[pos>>3];

  }
  function bits(n){ var v=0,i; for(i=0;i<n;i++){ v=(v<<1)|bit(); } return v; }

    var lz=0;
    while(bit()===0){ lz++; if(lz>32){ throw new Error('ue'); } }
    return (1<<lz)-1+(lz?bits(lz):0);
  }
  function se(){ var k=ue(); return (k&1)?(k+1)/2:-(k>>1); }
  var HIGH=[100,110,122,244,44,83,86,118,128,138,139,134,135];
  try{
    var profile=bits(8); bits(8); bits(8);
    ue();
    var chroma=1;
    if(HIGH.indexOf(profile)>=0){
      chroma=ue();
      if(chroma===3){ bit(); }
      ue(); ue(); bit();
      if(bit()){
        var n=chroma!==3?8:12,i,j;
        for(i=0;i<n;i++){
          if(bit()){
            var size=i<6?16:64,last=8,next=8;
            for(j=0;j<size;j++){

              last=next===0?last:next;
            }
          }

      }
    }
    ue();

    if(poc===0){ ue(); }

      bit(); se(); se();

    bit();
    var cropL=0,cropR=0,cropT=0,cropB=0;
    if(bit()){ cropL=ue(); cropR=ue(); cropT=ue(); cropB=ue(); }

    if(chroma===1){ subW=2; subH=2; }

function fixTimestamp(ts,last){
  last=Math.max(0,Math.floor(last||0));
  if(!isFinite(ts)){ return last; }
  ts=Math.max(0,Math.floor(ts));
  return ts>=last?ts:last+1;

function matrixBytes(){
  return concatAll([u32be(0x00010000),u32be(0),u32be(0),u32be(0),u32be(0x00010000),u32be(0),u32be(0),u32be(0),u32be(0x40000000)]);
}
function makeTkhd(id,width,height,isAudio){
  return fullbox('tkhd',0,0x000007,[
    u32be(0),u32be(0),u32be(id),u32be(0),u32be(0),u64be(0),
    u16be(0),u16be(0),u16be(isAudio?0x0100:0),u16be(0),
    matrixBytes(),u32be(width<<16),u32be(height<<16)
  ]);
}
function makeMvhd(nextId){
  return fullbox('mvhd',0,0,[
    u32be(0),u32be(0),u32be(1000),u32be(0),u32be(0x00010000),u16be(0x0100),u16be(0),
    u64be(0),matrixBytes(),
    u32be(0),u32be(0),u32be(0),u32be(0),u32be(0),u32be(0),u32be(nextId)

function makeMdhd(timescale){
  return fullbox('mdhd',0,0,[u32be(0),u32be(0),u32be(timescale),u32be(0),u16be(0x55c4),u16be(0)]);

function makeHdlr(handler,name){
  return fullbox('hdlr',0,0,[u32be(0),asciiBytes(handler),u32be(0),u32be(0),u32be(0),asciiBytes(name),zeros(1)]);
}
function makeDinf(){
  return mp4box('dinf',[fullbox('dref',0,0,[u32be(1),fullbox('url ',0,1,[])])]);
}
function makeStsdVideo(cfg){
  var avc1=mp4box('avc1',[
    zeros(6),u16be(1),u16be(0),u16be(0),u32be(0),u32be(0),u32be(0),
    u16be(cfg.width||0),u16be(cfg.height||0),
    u32be(0x00480000),u32be(0x00480000),u32be(0),u16be(1),
    zeros(32),u16be(0x0018),u16be(0xffff),
    mp4box('avcC',[buildAvcC(cfg)])

}
function sizeDesc(tag,body){
  if(body.length>127){ throw new Error('descriptor too long'); }
  return concatAll([new Uint8Array([tag,body.length]),body]);

function makeEsds(asc,sampleRate){
  var dsi=sizeDesc(0x05,asc);

  return fullbox('esds',0,0,[sizeDesc(0x03,esBody)]);
}
function makeStsdAudio(cfg){
  var mp4a=mp4box('mp4a',[
    zeros(6),u16be(1),zeros(8),
    u16be(cfg.channels||1),u16be(16),u16be(0),u16be(0),
    u32be((cfg.sampleRate||48000)<<16),
    makeEsds(cfg.asc,cfg.sampleRate)

  return fullbox('stsd',0,0,[u32be(1),mp4a]);
}
function makeStbl(stsd){
  return mp4box('stbl',[
    stsd,
    fullbox('stts',0,0,[u32be(0)]),
    fullbox('stsc',0,0,[u32be(0)]),
    fullbox('stsz',0,0,[u32be(0),u32be(0)]),
    fullbox('stco',0,0,[u32be(0)])
  ]);
}
function makeMinfVideo(cfg){
  return mp4box('minf',[
    fullbox('vmhd',0,1,[u16be(0),u16be(0),u16be(0),u16be(0)]),
    makeDinf(),makeStbl(makeStsdVideo(cfg))
  ]);
}
function makeMinfAudio(cfg){
  return mp4box('minf',[
    fullbox('smhd',0,0,[u16be(0),u16be(0)]),
    makeDinf(),makeStbl(makeStsdAudio(cfg))
  ]);
}
function makeTrakVideo(cfg){
  return mp4box('trak',[makeTkhd(1,cfg.width||0,cfg.height||0,false),
    mp4box('mdia',[makeMdhd(1000),makeHdlr('vide','VideoHandler'),makeMinfVideo(cfg)])]);
}
function makeTrakAudio(cfg){
  return mp4box('trak',[makeTkhd(2,0,0,true),
    mp4box('mdia',[makeMdhd(cfg.sampleRate||48000),makeHdlr('soun','SoundHandler'),makeMinfAudio(cfg)])]);
}
function makeTrex(id){
  return fullbox('trex',0,0,[u32be(id),u32be(1),u32be(0),u32be(0),u32be(0)]);
}
function buildMoov(opt){
  if(!opt||!opt.video||!opt.video.sps||!opt.video.sps.length){ return null; }

  var parts=[makeMvhd(audio?3:2),makeTrakVideo(opt.video)];
  if(audio){ parts.push(makeTrakAudio(audio)); }

function buildFtyp(){
  return mp4box('ftyp',[asciiBytes('isom'),u32be(0x200),asciiBytes('isom'),asciiBytes('iso5'),asciiBytes('avc1'),asciiBytes('mp41')]);
}
function buildInitSegment(opt){
  try{

  }catch(e){ this.fail('sourcebuffer_failed'); return false; }
  S.hasAudio=this.useAudio;
  flushSection(init);
  this.started=true;
  return true;
};
FlvParser.prototype.pushVideo=function(sample){
  if(!this.started&&!this.ensureStart(sample)){ return; }
  if(sample.isKey&&this.gV.length){ this.flushGroup(); }
  this.gV.push(sample);
  if(this.gV.length===1){ this.flushGroup(); return; }
  var dur=sample.ptsMs-this.gV[0].ptsMs;
  if(dur>=500){ this.flushGroup(); }
};
FlvParser.prototype.pushAudio=function(sample){
  if(!this.started){ return; }
  this.gA.push(sample);
  if(this.gA.length>50){ this.gA.shift(); }
};
FlvParser.prototype.flushGroup=function(){
  if(!this.gV.length){ return; }
  var g=this.gV; this.gV=[];
  var last=g[g.length-1].ptsMs;
  var aud=[],rest=[],i;
  for(i=0;i<this.gA.length;i++){
    if(this.gA[i].ptsMs<=last+100){ aud.push(this.gA[i]); } else { rest.push(this.gA[i]); }
  }
  this.gA=rest;
  var seg=buildMediaSegment(++this.seq,g,aud,this.acfg?this.acfg.sampleRate:48000);
  if(seg){ flushSection(seg); }
};
FlvParser.prototype.fail=function(reason){
  if(this.id!==S.playId){ return; }
  tryMjpeg('flv_'+reason);
};
FlvParser.prototype.end=function(){
  if(this.id!==S.playId){ return; }
  if(S.phase==='playing'){ reconnectFlv(); }
};
FlvParser.prototype.error=function(){
  if(this.id!==S.playId){ return; }
  if(S.phase==='playing'){ reconnectFlv(); } else { tryMjpeg('flv_stream_error'); }
};
function markFirstFrame(){
  if(S.firstFrame){ return; }
  S.firstFrame=true;
  clearTimeout(S.flvTimer);
  hideLoad();
  S.phase='playing'; setLive(true);
  S.reconnecting=0; S.lastBytesAt=Date.now();
  try{ E.v.play().catch(function(){}); }catch(e){}
  telem('play_first_frame',{playProtocol:S.currentProtocol||'flv',timeToFirstFrameMs:Date.now()-S.startedAt});
  show(E.soundBtn,!!S.hasAudio);
  if(S.hasAudio){ show(E.sound,true); } else { show(E.sound,false); }
  startStatusPoll();
}
function tryMjpeg(reason){
  var id=++S.playId;
  if(S.flvAbort){ try{ S.flvAbort.abort(); }catch(e){} S.flvAbort=null; }
  clearInterval(S.watchTimer); S.watchTimer=null;
  clearTimeout(S.mjTimer); clearInterval(S.mjPoll);
  teardownMse();
  S.currentProtocol='mjpeg';
  telem('play_fallback',{from:'flv',to:'mjpeg',reason:reason||'unknown'});
  setLoad('正在切换兼容模式…');
  show(E.v,false); show(E.mj,true); show(E.sound,false); show(E.soundBtn,false);
  S.hasAudio=false;
  var url=(S.protocols&&S.protocols.mjpeg&&S.protocols.mjpeg.url)||'/stream.mjpg';
  var done=false;
  function ok(){
    if(done||id!==S.playId){ return; }
    done=true; markFirstFrame();
  }
  E.mj.onload=ok;
  E.mj.onerror=function(){
    if(done||id!==S.playId){ return; }
    done=true;
    fail(5004,'已切换兼容模式仍无法播放，请确认分享者在线后重试。');
  };
  E.mj.src=url+'?mt='+encodeURIComponent(S.mediaToken);
  var t=setTimeout(function(){
    if(done||id!==S.playId){ return; }
    if(E.mj.naturalWidth>0){ ok(); } else {
      done=true;
      fail(5004,'兼容模式加载超时，请确认分享者在线后重试。');
    }
  },2000);
  var poll=setInterval(function(){
    if(done||id!==S.playId){ clearInterval(poll); return; }
    if(E.mj.naturalWidth>0){ clearInterval(poll); clearTimeout(t); ok(); }
  },300);
  S.mjTimer=t; S.mjPoll=poll;
}
function startStatusPoll(){
  clearInterval(S.statusTimer);
  S.statusTimer=setInterval(function(){
    if(S.closed||S.phase==='failed'||S.phase==='ended'){ return; }
    apiFetch('/api/v1/status').then(readJson).then(function(res){
      if(!res.ok){
        if(res.status===410){ ended(); }
        return;
      }
      var st=res.json||{};
      var state=String(st.state||'').toLowerCase();
      if(state==='closed'||state==='failed'){ ended(); return; }
      S.viewers=st.viewers||0; S.maxViewers=st.maxViewers||3;
      updateHud(st);
    }).catch(function(){});
  },5000);
}
function updateHud(st){
  var viewers=st.viewers; if(typeof viewers!=='number'){ viewers=S.viewers; }
  var max=st.maxViewers; if(typeof max!=='number'){ max=S.maxViewers; }
  text(E.viewers, viewers+'/'+max+' 人观看');
  var kbps=st.bitrateKbps;
  if(typeof kbps!=='number'&&typeof st.bitrateBps==='number'){ kbps=Math.round(st.bitrateBps/1000); }
  var rate=(typeof kbps==='number'?kbps:0)+' kbps';
  if(typeof st.fps==='number'){ rate+=' · '+st.fps+' fps'; }
  text(E.rate,rate);
}
function bind(){
  E.retry.addEventListener('click',function(){ start(); });
  E.pinOk.addEventListener('click',submitPin);
  E.pin.addEventListener('keydown',function(e){ if(e.key==='Enter'){ submitPin(); } });
  E.pin.addEventListener('input',function(){ E.pin.value=E.pin.value.replace(/\D/g,'').slice(0,6); });
  E.soundBtn.addEventListener('click',function(){
    S.muted=false; E.v.muted=false;
    if(E.v.play){ E.v.play().catch(function(){}); }
    text(E.soundBtn,'静音');
    show(E.sound,false);
  });
  E.sound.addEventListener('click',function(){
    S.muted=false; E.v.muted=false;
    if(E.v.play){ E.v.play().catch(function(){}); }
    show(E.sound,false);
    text(E.soundBtn,'静音');
    E.soundBtn.setAttribute('aria-label','静音');
  });
  E.fullBtn.addEventListener('click',function(){
    try{
      if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
      else if(E.stage.requestFullscreen){ E.stage.requestFullscreen().catch(function(){}); }
    }catch(e){}
  });
  E.v.addEventListener('loadeddata',function(){ if(S.currentProtocol!=='mjpeg'){ markFirstFrame(); } });
  E.v.addEventListener('playing',function(){ if(S.currentProtocol!=='mjpeg'){ markFirstFrame(); } });
  E.v.addEventListener('error',function(){
    if(S.currentProtocol==='mjpeg'||S.phase!=='trying'){ return; }
    tryMjpeg('video_element_error');
  });
  setInterval(flushTelem,10000);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ return; }
    if(S.phase==='playing'){ renewToken(); }
  });
}
bind();
start();
})();
</script>
